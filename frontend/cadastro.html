<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Produto</title>
</head>
<body>
    <h1>Cadastrar Produto</h1>
    <a href="index.html">Voltar para a Lista</a>
    <hr>

    <form id="form-cadastro">
        <label>Nome:</label><br>
        <input type="text" id="nome" required><br><br>

        <label>Preço:</label><br>
        <input type="number" id="preco" step="0.01" required><br><br>

        <label>Descrição:</label><br>
        <textarea id="descricao"></textarea><br><br>

        <button type="submit">Salvar Produto</button>
    </form>

    <script>
        document.getElementById('form-cadastro').addEventListener('submit', async (evento) => {
            evento.preventDefault() // Evita que a página recarregue

            const nome = document.getElementById('nome').value
            const preco = document.getElementById('preco').value
            const descricao = document.getElementById('descricao').value

            const resposta = await fetch('http://localhost:3000/produtos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nome, preco, descricao })
            })

            if (resposta.ok) {
                alert('Produto cadastrado com sucesso!')
                window.location.href = 'index.html' // Redireciona de volta para a lista
            }
        })
    </script>
</body>
</html>
